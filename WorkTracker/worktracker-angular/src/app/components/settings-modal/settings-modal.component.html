<div class="modal-overlay" (click)="close.emit()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Definições</h2>
      <button class="btn btn-outline btn-icon" (click)="close.emit()">
        <ion-icon name="close-outline"></ion-icon>
      </button>
    </div>

    <label class="ios-subtitle">Valor Hora (€)</label>
    <input type="number" [(ngModel)]="rate">

    <div style="margin-top: 20px; margin-bottom: 20px; border-top: 1px solid var(--border); padding-top: 20px;">
      <label class="ios-subtitle">Gestão de Dados</label>
      <div style="display: flex; gap: 10px; flex-direction: column;">
        
        <button class="btn btn-outline btn-block" (click)="exportData()">
          <ion-icon name="cloud-upload-outline"></ion-icon> Exportar Backup
        </button>

        <button class="btn btn-outline btn-block" (click)="triggerImport()">
          <ion-icon name="download-outline"></ion-icon> Importar Backup
        </button>

        <input 
          type="file" 
          #fileInput 
          style="display: none" 
          (change)="onFileSelected($event)" 
          accept=".json">
      </div>
    </div>

    <button class="btn btn-block" (click)="save()">Guardar e Fechar</button>
  </div>
</div>
