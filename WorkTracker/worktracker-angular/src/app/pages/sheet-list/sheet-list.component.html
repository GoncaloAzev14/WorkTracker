<div class="dashboard-container" [class.has-selection-bar]="selectionMode">

  <header class="dashboard-header">
    <div>
      <h1 class="title">Meses</h1>
      <p class="subtitle">Gere os teus registos mensais</p>
    </div>
    <button class="settings-btn" (click)="openSettings()">
      <ion-icon name="person-circle-outline"></ion-icon>
    </button>
  </header>

  <div class="card-stack">

    <button class="action-banner" (click)="createNew()">
      <div class="banner-content">
        <span class="banner-title">Começar nova folha</span>
        <span class="banner-subtitle">Adiciona um novo mês ao teu histórico</span>
      </div>
      <div class="banner-icon">
        <ion-icon name="add-circle"></ion-icon>
      </div>
    </button>

    <!-- SEARCH + SORT TOOLBAR -->
    <div class="toolbar">
      <div class="search-box">
        <ion-icon name="search-outline"></ion-icon>
        <input
          type="text"
          placeholder="Pesquisar folha..."
          [value]="searchTerm()"
          (input)="setSearch($event)"
        />
        <button class="clear-btn" *ngIf="searchTerm()" (click)="searchTerm.set('')">
          <ion-icon name="close-circle"></ion-icon>
        </button>
      </div>
      <div class="segmented-control">
        <button class="seg-option" [class.active]="sortOrder() === 'newest'" (click)="setSortOrder('newest')">Recente</button>
        <button class="seg-option" [class.active]="sortOrder() === 'oldest'" (click)="setSortOrder('oldest')">Antigo</button>
        <button class="seg-option" [class.active]="sortOrder() === 'name'"   (click)="setSortOrder('name')">Nome</button>
      </div>
    </div>

    <!-- Row: right-side button only — Selecionar (entry) or Selecionar/Desselecionar (toggle) -->
    <div class="list-header-row" *ngIf="filteredMonths().length > 0">
      <span></span>
      <button class="select-mode-btn" *ngIf="!selectionMode" (click)="toggleSelectionMode()">
        Selecionar
      </button>
      <button class="select-mode-btn sel-all-toggle" *ngIf="selectionMode" (click)="toggleSelectAll()">
        {{ allSelected() ? 'Limpar' : 'Selecionar' }}
        <div class="sel-circle" [class.checked]="allSelected()">
          <ion-icon name="checkmark" *ngIf="allSelected()"></ion-icon>
        </div>
      </button>
    </div>

    <div class="sheets-list">
      <div class="sheet-item"
           *ngFor="let m of filteredMonths()"
           [class.selected]="isSelected(m.id)"
           [class.selection-mode]="selectionMode"
           [routerLink]="selectionMode ? null : ['/month', m.id]"
           (click)="selectionMode ? toggleSelect(m.id) : null">

        <div class="check-column" *ngIf="selectionMode">
          <div class="sel-circle" [class.checked]="isSelected(m.id)">
            <ion-icon name="checkmark" *ngIf="isSelected(m.id)"></ion-icon>
          </div>
        </div>

        <div class="date-column">
          <span class="month-short">{{ m.month | date:'MMM':'':'pt-PT' | uppercase }}</span>
          <span class="year-num">{{ m.month | date:'yyyy' }}</span>
        </div>

        <div class="info-column">
          <span class="sheet-name">{{ m.name }}</span>
          <div class="stats-row">
            <span class="stat-badge">
              <ion-icon name="time-outline"></ion-icon>
              {{ m.entries.length }} dias
            </span>
          </div>
        </div>

        <div class="arrow-column" *ngIf="!selectionMode">
          <ion-icon name="chevron-forward"></ion-icon>
        </div>

      </div>

      <div class="empty-sheets" *ngIf="filteredMonths().length === 0">
        <ion-icon name="search-outline" *ngIf="searchTerm(); else noSheets"></ion-icon>
        <ng-template #noSheets><ion-icon name="calendar-outline"></ion-icon></ng-template>
        <p>{{ searchTerm() ? 'Nenhuma folha encontrada.' : 'Ainda não tens folhas. Cria a primeira!' }}</p>
      </div>
    </div>

  </div>

</div>

<!-- BULK DELETE BAR -->
<div class="selection-bar" *ngIf="selectionMode">
  <button class="cancel-sel-btn" (click)="toggleSelectionMode()">Cancelar</button>
  <button class="delete-selected-btn"
          *ngIf="selectedCount() > 0"
          (click)="deleteSelected()">
    <ion-icon name="trash-outline"></ion-icon>
    Eliminar ({{ selectedCount() }})
  </button>
  <span class="sel-hint" *ngIf="selectedCount() === 0">(Vazio)</span>
</div>

<app-settings-modal *ngIf="showSettings" (close)="showSettings = false"></app-settings-modal>
<app-new-sheet-modal *ngIf="showNewSheet" (close)="onNewSheetClose($event)"></app-new-sheet-modal>
