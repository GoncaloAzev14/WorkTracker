<div class="app-container">
  <div class="sidebar-backdrop" *ngIf="sidebarOpen" (click)="toggleSidebar()"></div>

  <aside class="sidebar" [class.open]="sidebarOpen" *ngIf="!isMainPage">
    <app-sidebar
      (closeMenu)="sidebarOpen = false"
      (requestNewSheet)="openNewSheet()"
      (requestSettings)="openSettings()"
      (requestRename)="openRename($event)">
    </app-sidebar>
  </aside>

  <main class="main-content">
    <button class="mobile-menu-btn" (click)="toggleSidebar()" *ngIf="!isMainPage">
      <ion-icon name="menu-outline"></ion-icon>
    </button>
    
    <button class="mobile-menu-btn" *ngIf="isMainPage" (click)="openSettings()" style="display:block; right: 15px; left: auto;">
       <ion-icon name="settings-outline"></ion-icon>
    </button>

    <router-outlet></router-outlet>
  </main>

  <app-new-sheet-modal *ngIf="showNewSheet" (close)="onNewSheetClose($event)"></app-new-sheet-modal>
  <app-settings-modal *ngIf="showSettings" (close)="onSettingsClose()"></app-settings-modal>
  <app-rename-modal *ngIf="monthToRename" [month]="monthToRename!" (close)="onRenameClose($event)"></app-rename-modal>
</div>
