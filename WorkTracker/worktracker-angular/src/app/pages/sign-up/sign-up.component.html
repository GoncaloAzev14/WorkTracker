<div class="auth-container">
  <div class="auth-card">
    
    <div class="header">
      <div class="icon-circle green">
        <ion-icon name="person-add"></ion-icon>
      </div>
      <h1>Criar Conta</h1>
      <p>Junta-te a nós e organiza o teu trabalho</p>
    </div>

    <div class="form-group">
      <div class="input-wrapper green-focus">
        <ion-icon name="mail-outline"></ion-icon>
        <input type="email" [(ngModel)]="email" placeholder="Email" (keyup.enter)="signup()">
      </div>
      
      <div class="input-wrapper green-focus">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <input type="password" [(ngModel)]="password" placeholder="Password" (keyup.enter)="signup()">
      </div>
    </div>

    <button class="btn-primary green" (click)="signup()">
      Criar Conta
    </button>
    
    <div class="error-banner" *ngIf="error">
      <ion-icon name="alert-circle"></ion-icon>
      <span>{{ error }}</span>
    </div>

    <div class="footer-links">
      <span class="text-muted">Já tens conta?</span>
      <a routerLink="/login" class="link green-text">Entrar</a>
    </div>

  </div>
</div>
