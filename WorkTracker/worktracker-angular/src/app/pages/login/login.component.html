<div class="auth-container">
  <div class="auth-card">
    
    <div class="header">
      <div class="icon-circle blue">
        <ion-icon name="person"></ion-icon>
      </div>
      <h1>Bem-vindo</h1>
      <p>Inicia sessão para continuar</p>
    </div>

    <div class="form-group">
      <div class="input-wrapper">
        <ion-icon name="mail-outline"></ion-icon>
        <input type="email" [(ngModel)]="email" placeholder="Email" (keyup.enter)="login()">
      </div>
      
      <div class="input-wrapper">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <input type="password" [(ngModel)]="password" placeholder="Password" (keyup.enter)="login()">
      </div>
    </div>

    <button class="btn-primary blue" (click)="login()">
      Entrar
    </button>
    
    <div class="error-banner" *ngIf="error">
      <ion-icon name="alert-circle"></ion-icon>
      <span>{{ error }}</span>
    </div>

    <div class="footer-links">
      <span class="text-muted">Não tens conta?</span>
      <a routerLink="/signup" class="link blue">Criar conta</a>
    </div>

  </div>
</div>
